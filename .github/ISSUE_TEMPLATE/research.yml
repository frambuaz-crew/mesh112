name: 🔬 Araştırma
description: Teknoloji araştır
title: "[RESEARCH] "
labels: ["research"]
assignees: []

body:
  - type: textarea
    id: question
    attributes:
      label: Ne araştırılacak?
      placeholder: "TinyLlama mı Phi-2 mi kullanmalıyız?"
    validations:
      required: true
  
  - type: textarea
    id: options
    attributes:
      label: Seçenekler
      placeholder: |
        1. TinyLlama (küçük, hızlı)
        2. Phi-2 (büyük, daha akıllı)
    validations:
      required: true
  
  - type: input
    id: estimate
    attributes:
      label: Kaç saat sürer?
      placeholder: "8-12 saat"
  
  - type: dropdown
    id: assignee_role
    attributes:
      label: Kim araştıracak?
      options:
        - Emre (PM)
        - Kişi 2 (AI)
        - Kişi 3 (Network)
        - Kişi 4 (UI/UX)
        - Kişi 5 (Mobile)
    validations:
      required: true
