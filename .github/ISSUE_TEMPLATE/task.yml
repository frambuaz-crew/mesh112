name: 🎯 Task (Sprint Görevi)
description: Sprint görevi oluştur
title: "[TASK] "
labels: ["task"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ## 🎯 Sprint Görevi
  
  - type: input
    id: sprint
    attributes:
      label: Sprint
      description: Hangi sprint'e ait?
      placeholder: "Sprint 1"
    validations:
      required: true
  
  - type: textarea
    id: description
    attributes:
      label: Görev Açıklaması
      description: Ne yapılacak?
      placeholder: "Firebase Authentication entegrasyonu - Email/Password + Google Sign-In"
    validations:
      required: true
  
  - type: textarea
    id: checklist
    attributes:
      label: Alt Görevler (Checklist)
      description: Tamamlanması gereken adımlar
      value: |
        - [ ] Firebase projesi oluştur
        - [ ] Authentication servisi aktif et
        - [ ] React Native'de firebase kütüphanesi kur
        - [ ] Login/Signup UI oluştur
        - [ ] Test et (Android + iOS)
    validations:
      required: true
  
  - type: input
    id: estimate
    attributes:
      label: Tahmini Süre (saat)
      placeholder: "8"
    validations:
      required: true
  
  - type: dropdown
    id: assignee_role
    attributes:
      label: Sorumlu Rol
      description: Kim yapmalı?
      options:
        - Emre (PM / Full Stack)
        - Kişi 2 (AI/ML Engineer)
        - Kişi 3 (Network Engineer)
        - Kişi 4 (UI/UX Designer)
        - Kişi 5 (Mobile Developer)
    validations:
      required: true
  
  - type: dropdown
    id: priority
    attributes:
      label: Öncelik
      options:
        - Critical (Blocker)
        - High
        - Medium
        - Low
    validations:
      required: true
  
  - type: textarea
    id: acceptance
    attributes:
      label: Kabul Kriterleri
      description: Görev ne zaman tamamlanmış sayılır?
      placeholder: |
        ✅ Kullanıcı email/şifre ile kayıt olabiliyor
        ✅ Google Sign-In çalışıyor
        ✅ Token'lar güvenli şekilde saklanıyor
        ✅ Logout fonksiyonu çalışıyor
  
  - type: textarea
    id: dependencies
    attributes:
      label: Bağımlılıklar
      description: Bu görev için önce hangi issue'ların tamamlanması gerekli?
      placeholder: "Issue #5 (Firebase setup) tamamlanmalı"
  
  - type: textarea
    id: notes
    attributes:
      label: Ek Notlar
      description: Bilinmesi gereken özel durumlar
      placeholder: "iOS için Apple Developer hesabı gerekebilir"
