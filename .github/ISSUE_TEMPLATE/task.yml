name: 🎯 Görev
description: Yapılacak iş
title: "[TASK] "
labels: ["task"]
assignees: []

body:
  - type: textarea
    id: description
    attributes:
      label: Ne yapılacak?
      placeholder: "Firebase Authentication ekle - email/password ile giriş"
    validations:
      required: true
  
  - type: textarea
    id: checklist
    attributes:
      label: Adımlar
      value: |
        - [ ] Adım 1
        - [ ] Adım 2
        - [ ] Adım 3
    validations:
      required: true
  
  - type: input
    id: estimate
    attributes:
      label: Kaç saat sürer?
      placeholder: "4-6 saat"
  
  - type: dropdown
    id: assignee_role
    attributes:
      label: Kim yapacak?
      options:
        - Emre (PM / Full Stack)
        - Furkan (AI/ML Engineer)
        - Oğuz (Network Engineer)
        - Hasan (Mobile Developer)
        - Sümeyye (UI/UX Designer)
    validations:
      required: true
