name: GitHub Projects Automation

on:
  issues:
    types: [opened, assigned, closed]
  pull_request:
    types: [opened, closed]

jobs:
  update-project-status:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
    
    steps:
      - name: Move new issue to Backlog
        if: github.event.action == 'opened' && github.event_name == 'issues'
        uses: actions/add-to-project@v0.5.0
        with:
          project-url: https://github.com/orgs/frambuaz-crew/projects/1
          github-token: ${{ secrets.PROJECT_TOKEN }}
          labeled: ''
          label-operator: OR
      
      - name: Move to In Progress when assigned
        if: github.event.action == 'assigned' && github.event_name == 'issues'
        uses: leonsteinhaeuser/project-beta-automations@v2.2.1
        with:
          gh_token: ${{ secrets.PROJECT_TOKEN }}
          organization: frambuaz-crew
          project_id: 1
          resource_node_id: ${{ github.event.issue.node_id }}
          status_value: "In Progress"
      
      - name: Move to Review when PR opened (linked issues)
        if: github.event.action == 'opened' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            // PR description'dan linked issue'ları bul ve logla
            const prBody = context.payload.pull_request.body || '';
            const issueRegex = /(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi;
            const issueNumbers = [...prBody.matchAll(issueRegex)].map(m => m[1]);
            
            if (issueNumbers.length === 0) {
              core.warning('⚠️ No linked issues found! Add "Closes #X" to PR description');
            } else {
              core.info(`✅ Found linked issues: #${issueNumbers.join(', #')}`);
              core.info('📌 GitHub will auto-link these issues to the PR');
            }
            
            // GitHub'ın built-in linking'i otomatik çalışır
            // Bu workflow sadece bilgi amaçlı
            // Gerçek linking: PR description'daki "Closes #X" keyword'ü ile yapılır

      
      - name: Move to Ready to Test when PR merged to develop
        if: |
          github.event.action == 'closed' && 
          github.event.pull_request.merged == true &&
          github.event.pull_request.base.ref == 'develop'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            // PR description'dan linked issue'ları bul
            const prBody = context.payload.pull_request.body || '';
            const issueRegex = /(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi;
            const issueNumbers = [...prBody.matchAll(issueRegex)].map(m => m[1]);
            
            if (issueNumbers.length === 0) {
              core.warning('⚠️ No linked issues found! Cannot move to Ready to Test');
              return;
            }
            
            core.info(`✅ Found ${issueNumbers.length} linked issue(s): #${issueNumbers.join(', #')}`);
            
            // Her linked issue'yu Ready to Test'e taşı
            for (const issueNum of issueNumbers) {
              try {
                // Issue bilgilerini al
                const issue = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: parseInt(issueNum)
                });
                
                core.info(`📦 Moving issue #${issueNum} to Ready to Test`);
                
                // Project ID ve field ID'leri (bunları sonra GraphQL ile alacağız)
                // Şimdilik leonsteinhaeuser action'ını kullanamayız çünkü loop içindeyiz
                // Bu yüzden manuel comment ekleyelim (geçici çözüm)
                
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: parseInt(issueNum),
                  body: `🚀 PR merged to \`develop\`! Moving to **Ready to Test** column.\n\n✅ [View PR](${context.payload.pull_request.html_url})`
                });
                
                core.info(`✅ Issue #${issueNum} processed`);
              } catch (error) {
                core.error(`❌ Failed to process issue #${issueNum}: ${error.message}`);
              }
            }
      
      - name: Move to Done when PR merged to main
        if: |
          github.event.action == 'closed' && 
          github.event.pull_request.merged == true &&
          github.event.pull_request.base.ref == 'main'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            // PR description'dan linked issue'ları bul
            const prBody = context.payload.pull_request.body || '';
            const issueRegex = /(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi;
            const issueNumbers = [...prBody.matchAll(issueRegex)].map(m => m[1]);
            
            if (issueNumbers.length === 0) {
              core.warning('⚠️ No linked issues found! Cannot move to Done');
              return;
            }
            
            core.info(`✅ Found ${issueNumbers.length} linked issue(s): #${issueNumbers.join(', #')}`);
            
            // Her linked issue'yu Done'a taşı ve kapat
            for (const issueNum of issueNumbers) {
              try {
                core.info(`📦 Moving issue #${issueNum} to Done and closing`);
                
                // Issue'yu kapat
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: parseInt(issueNum),
                  state: 'closed'
                });
                
                // Comment ekle
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: parseInt(issueNum),
                  body: `🎉 Released to production! Moving to **Done**.\n\n✅ [View PR](${context.payload.pull_request.html_url})`
                });
                
                core.info(`✅ Issue #${issueNum} closed and moved to Done`);
              } catch (error) {
                core.error(`❌ Failed to process issue #${issueNum}: ${error.message}`);
              }
            }
      
      - name: Legacy - Close issue when PR merged to main
        if: |
          github.event.action == 'closed' && 
          github.event.pull_request.merged == true &&
          github.event.pull_request.base.ref == 'main'
        uses: leonsteinhaeuser/project-beta-automations@v2.2.1
        with:
          gh_token: ${{ secrets.PROJECT_TOKEN }}
          organization: frambuaz-crew
          project_id: 1
          resource_node_id: ${{ github.event.pull_request.node_id }}
          status_value: "Done"
